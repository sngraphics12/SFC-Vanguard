<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fan Realm - Cart</title>

    <link rel="stylesheet" href="./assets/css/style.css">
    <link rel="stylesheet" href="singlepage/assets/css/cart.css">
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css">
</head>

<body>

<header>
    <div class="logo-header">
        <div class="bars">
            <label for="check">
                <i class="fa-solid fa-bars"></i>
            </label>
        </div>

        <div class="head">
            <h1>Fan <span>Realm</span></h1>
            <p>All Fandom One Place</p>
        </div>
    </div>

    <div class="search-bar">
        <i class="fa-solid fa-magnifying-glass"></i>
        <input type="search" placeholder="Search for your favorite fandoms">
    </div>

    <input id="check" type="checkbox">

    <div class="mobile-menu">
        <a href="index.html">Home</a>
        <a href="#">Gaming</a>
        <a href="#">Movies</a>
        <a href="#">Tv Shows</a>
        <a href="#">K-Pop</a>
        <a href="#">Comics</a>
        <a href="#">Manga</a>
        <a href="#">Events</a>
        <a href="#">Store</a>
        <a href="#">Community</a>
        <a href="#">More</a>
    </div>

    <div class="side-functions">
        <ul>
            <li>
                <i class="fa-regular fa-bookmark"></i>
                <a href="#">Bookmarks</a>
            </li>

            <li>
                <i class="fa-solid fa-cart-shopping"></i>
                <a href="cart.html">Cart</a>
                <span id="cart-items">0</span>
            </li>
        </ul>
    </div>
</header>

<aside class="sidebar">
    <nav>
        <a class="navlinks" href="index.html"><i class="fa-solid fa-house"></i> Home</a>
        <a class="navlinks" href="#"><i class="fa-solid fa-torii-gate"></i> Gaming</a>
        <a class="navlinks" href="#"><i class="fa-solid fa-clapperboard"></i> Movies</a>
        <a class="navlinks" href="#"><i class="fa-solid fa-tv"></i> Tv Shows</a>
        <a class="navlinks" href="#"><i class="fa-solid fa-music"></i> K-Pop</a>
        <a class="navlinks" href="#"><i class="fa-solid fa-book-open"></i> Comics</a>
        <a class="navlinks" href=""><i class="fa-brands fa-leanpub"></i> Manga</a>
        <a class="navlinks" href=""><i class="fa-regular fa-calendar"></i> Events</a>
        <a class="navlinks" href="store.html"><i class="fa-solid fa-shop"></i> Store</a>
        <a class="navlinks" href="#"><i class="fa-solid fa-users"></i> Community</a>
        <a class="navlinks" href="#"><i class="fa-solid fa-users"></i> More</a>
    </nav>
</aside>

<main class="cart-page">
    <h1>Shopping Cart</h1>

    <div id="cart-products"></div>

    <div class="cart-summary">
        <p>Items: <span id="cart-count">0</span></p>
        <p>Subtotal: <span id="subtotal">Rs. 0</span></p>
        <p>Grand Total: <span id="grand-total">Rs. 0</span></p>

        <button onclick="clearCart()" class="clear-cart">Clear Cart</button>
        <a href="store.html" class="continue-shopping">Continue Shopping</a>
    </div>
</main>

<script src="assets/js/store.js"></script>

</body>
</html>
