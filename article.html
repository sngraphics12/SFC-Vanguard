<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css">
       <style>
        
        body{
            width: 100%;
            background-color:#050A0F;
            overflow-x: hidden ;
        }

        .gamesmain{
        margin-left: 200px;
    }
        .article-row{
            display: grid;
            grid-template-columns: repeat(3,1fr);
            gap: 20px;
            flex-wrap: wrap;

        }

                :root{

    --background:#050a0f;
    --side-bar-dark:#08121a;
    --cards-panel-navy:#0d1822;
    --deep-navy:#081225;
    --blue-accent:#315bff;
    --hover-panel-cards:#111f2a;
    --border-blue-gray:#243746;
    --main-border:#243452;
    --primary-gold-main:#f2b95e;
    --light-gold-hover:#ffd98a;
    --dark-gold-gradients-accents:#a86f28;
    --white:#f5f7fa;
    --soft-whiteL:#cbd5df;
    --muted-gray:#7f8c99;
    --success-green:#31c48d;
    --purple-accent-category-tags:#9b7cff;


        .article-row {
          width: 80%;
          min-height: 40vh;
          display: grid;
          grid-template-columns: repeat(3, 350px);
          gap: 20px;
          margin-top: 30px;
          margin-left:50px;
          padding-bottom: 40px;
        }

        .card{
            width:280px;
            height: 400px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.2);
            overflow: hidden;
            transition: all 0.2s ease;
            background-color: var(--cards-panel-navy);
            margin-top: 70px;
            margin-bottom: 70px;
            border: 1px solid var(--main-border);
            border-radius: 10px;

        }
        .card:hover{
            transform: translateY(-2px);
            border: 1px solid var(--primary-gold-main);
        }
        
        .card-img{
            width: 100%;
            height: 200px;
        }

        .card-img img{
            width: 280px;
            height: 200px;
            object-fit: calc(280px,200px);
            object-position: center;
            background-size:contain;
            background-position: center;
        }

        .card-content{
            align-self: flex-start;
            text-align: left;
            padding:  10px;
            color: #f2b95e;
            font-size:14px;
            line-height: 15px;
        }

        .card-content p{
            margin-top: 20px;
        }



        .buttons{
            display: flex;
            justify-content: center;
            gap: 10px;
            align-items: center;
            margin-top: 20px;
            margin-bottom: 20px;
            margin-right: 100px;
        }

        .buttons button{
            padding: 10px 25px;
            color : white;
            background-color: #000204;
            border : none;
            outline : none;
            cursor: pointer;
            border-radius: 25px;
            color: #f2b95e;
            background:linear-gradient(108deg,var(--hover-panel-cards),var(--border-blue-gray));
        }


        .main-card{
            display: flex;
            justify-content: space-around;
            flex-direction: column;

        }
    

        .card{
    animation: show 2s ease;
}

@keyframes show{
    from{
        opacity: 0;
        transform: translateY(10px);
    }
    to{
        opacity: 1;
        transform: translateY(0);
    }
}
        }

        
    </style>
</head>
    <div class="gamesmain">
    <h1  align="center" style=" font-family: Arial, sans-serif;color: #f2b95e;margin-top: 75px;">Latest Articles</h1>
    
  <div class="buttons">
        <button onclick="filterProducts('all')">All</button>
        <button onclick="filterProducts('movies')">MOVIES</button>
        <button onclick="filterProducts('games')">GAMES</button>
        <button onclick="filterProducts('manga')">MANGA</button>
        <button onclick="filterProducts('anime')">ANIME</button>
        <button onclick="filterProducts('k-pop')">K-POP</button>
        <button onclick="filterProducts('tv-shows')">TV-SHOWS</button>
        <button onclick="filterProducts('comic')">COMICS</button>
    </div>

    <div class="article-row" id="myrow" >
       
    </div>

    </div>

    <script src="./assets/js/article.js"></script>
</body>
</html>
